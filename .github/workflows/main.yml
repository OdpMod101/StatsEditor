name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
          - platform: mac
            os: macos-latest
          - platform: ios
            os: macos-latest
          - platform: android64
            os: ubuntu-latest
          - platform: android32
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.platform }}

  package:
    name: Package builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Package Mod
        uses: geode-sdk/build-geode-mod/package@main
        
